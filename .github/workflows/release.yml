name: Release

on:
  push:
    tags: ['v*']
  # Manual run from the Actions tab: the release (and its tag) is created on
  # the selected branch's latest commit.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0'
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: Mapline ${{ inputs.version || github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
      # The Windows installer (.exe) is also attached inside a .zip, which some
      # browsers and mail filters let through more easily than a bare .exe.
      - name: Windows installer as a zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          REPO: ${{ github.repository }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $zip = "$($exe.BaseName).zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          # On a re-run, replace the zip already attached to the draft.
          $filter = '.[] | select(.name == "' + $zip + '") | .id'
          $old = gh api "repos/$env:REPO/releases/$env:RELEASE_ID/assets" --jq $filter
          if ($old) { gh api --method DELETE "repos/$env:REPO/releases/assets/$old" }
          gh api --method POST -H "Content-Type: application/zip" "https://uploads.github.com/repos/$env:REPO/releases/$env:RELEASE_ID/assets?name=$zip" --input $zip
          if ($LASTEXITCODE -ne 0) { throw "zip upload failed" }
